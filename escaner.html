<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar asistencia</title>
  <style>
    body{font-family:Arial;text-align:center;margin-top:50px}
    .info{font-size:1.2em;margin-bottom:20px}
  </style>
</head>
<body>
  <h1>Confirmar asistencia</h1>

  <div class="info" id="datos"></div>
  <p id="msg">Procesando...</p>

  <script>
    const urlScript = 'https://script.google.com/macros/s/AKfycbxt0u5TaxSC9OQeSf_84do7eQt6ulJjT8dJzis8_4Vii6RCbzPwiyt_0RPgNLJzBokC/exec'; // <-- cambia
    const params = new URLSearchParams(location.search);

    const fecha  = params.get('fecha');
    const control= params.get('control');
    const grado  = params.get('grado');
    const grupo  = params.get('grupo');
    const turno  = params.get('turno');
    const tutor  = params.get('tutor');

    if (!control || !nombre) {
      document.getElementById('msg').textContent = 'Faltan datos en el QR';
    } else {
      document.getElementById('datos').innerHTML = `
        <strong>Fecha:</strong> ${fecha}<br>
        <strong>Control:</strong> ${control}<br>
        <strong>Grado:</strong> ${grado}<br>
        <strong>Grupo:</strong> ${grupo}<br>
        <strong>Turno:</strong> ${turno}<br>
        <strong>Tutor:</strong> ${tutor}
      `;

      // Reemplaza tu fetch actual por este:
const body = new URLSearchParams({
  control: control,
  nombre:  nombre,
  grado:   grado,
  grupo:   grupo,
  turno:   turno,
  tutor:   tutor
});
fetch(urlScript, { method: 'POST', body })
  .then(r => r.text())
  .then(txt => document.getElementById('msg').textContent = txt)
  .catch(() => document.getElementById('msg').textContent = 'Error al registrar');
    }
  </script>
</body>
</html>

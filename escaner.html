<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escanear asistencia</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@latest/umd/index.min.js"></script>
  <style>body{font-family:Arial;text-align:center;margin-top:30px}video{width:300px}</style>
</head>
<body>
  <h1>Escanear código para pasar asistencia</h1>
  <video id="video" autoplay></video>
  <p id="result"></p>

  <script>
    const urlScript = 'https://script.google.com/macros/s/AKfycbyFQTE9jqM8vj3Ra0PM14SqwAPqcJF2ay8pj6Akc63YAMlwJ_kVf0SNup3ixbI6Fjo/exec'; // <-- cambia

    const codeReader = new ZXing.BrowserBarcodeReader();
    const videoElem  = document.getElementById('video');
    const resultElem = document.getElementById('result');

    codeReader.decodeFromVideoDevice(null, videoElem, (result, err) => {
      if (result) {
        codeReader.reset();
        const id = result.text;
        resultElem.textContent = 'ID escaneado: ' + id;
        fetch(urlScript + '?id=' + encodeURIComponent(id))
          .then(r => r.text())
          .then(txt => resultElem.textContent = txt)
          .catch(() => resultElem.textContent = 'Error al registrar');
      }
      if (err && !(err instanceof ZXing.NotFoundException)) {
        console.error(err);
      }
    });
  </script>
</body>
</html>

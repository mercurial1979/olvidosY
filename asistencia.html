<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registro de Asistencia</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container py-5">
  <h2 class="mb-4 text-center">Registrar Asistencia</h2>
  <form id="formAsistencia">
    <div class="mb-3">
      <input type="text" id="idAlumno" class="form-control" placeholder="ID del Alumno" required />
    </div>
    <button type="submit" class="btn btn-success w-100">Marcar Asistencia</button>
  </form>
  <div id="mensaje" class="mt-4"></div>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyIecXQs_knU_INbkd1-T7Ibme3WUD086Qthq3cSD3OKzV82mFc3cMWJNXRzvJ4oRH1Yg/exec';

  document.getElementById('formAsistencia').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('idAlumno').value;

    fetch(`${scriptURL}?action=asistencia&id=${encodeURIComponent(id)}`)
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          document.getElementById('mensaje').innerHTML = `<div class="alert alert-success">Asistencia registrada para ${data.nombre}. Mensaje WhatsApp enviado a ${data.telefono}</div>`;
        } else {
          document.getElementById('mensaje').innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      })
      .catch(() => {
        document.getElementById('mensaje').innerHTML = `<div class="alert alert-danger">Error al conectar con el servidor</div>`;
      });
  });
</script>
</body>
</html>

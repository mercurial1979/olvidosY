<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Estudiantes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .success {
      margin-top: 15px;
      padding: 10px;
      background-color: #d4edda;
      color: #155724;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Registro de Estudiante</h2>
    <form id="form">
      <label>ID del Estudiante</label>
      <input type="text" id="id" required>

      <label>Nombre del Estudiante</label>
      <input type="text" id="nombre" required>

      <label>Apellido Paterno</label>
      <input type="text" id="apellidoPaterno" required>

      <label>Apellido Materno</label>
      <input type="text" id="apellidoMaterno" required>

      <label>Nombre del Tutor</label>
      <input type="text" id="tutor" required>

      <label>Teléfono del Tutor</label>
      <input type="tel" id="telefono" required>

      <button type="submit">Guardar</button>
    </form>

    <div id="success" class="success">
      ✔ Registro guardado correctamente.
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbziwhr7BVNg-MCx4OOkOfF-j9K41aaXKfF_hReuWeZqn7t3zZKD7nru8dtjGHfk_7l6Jw/exec'; // Reemplaza con tu URL de Apps Script

    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const data = {
        id: document.getElementById('id').value,
        nombre: document.getElementById('nombre').value,
        apellidoPaterno: document.getElementById('apellidoPaterno').value,
        apellidoMaterno: document.getElementById('apellidoMaterno').value,
        tutor: document.getElementById('tutor').value,
        telefono: document.getElementById('telefono').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(data),
          headers: { 'Content-Type': 'application/json' }
        });

        document.getElementById('success').style.display = 'block';
        document.getElementById('form').reset();
        setTimeout(() => {
          document.getElementById('success').style.display = 'none';
        }, 3000);
      } catch (err) {
        alert('Error al guardar: ' + err);
      }
    });
  </script>

</body>
</html>

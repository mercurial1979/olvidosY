<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Alumnos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f8f9fa}
    .card{max-width:700px;margin:2rem auto;border-radius:1rem}
    .btn-citrix{background:#0f2b4b;color:#fff;border:none}
    .btn-citrix:hover{background:#0d1f36;color:#fff}
  </style>
</head>
<body>
<div class="container py-5">
  <div class="card shadow">
    <div class="card-header text-center"><h4>Registro de Alumnos</h4></div>
    <div class="card-body">
      <!-- FORMULARIO -->
      <form id="formRegistro">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">ID</label>
            <input type="text" class="form-control" name="id" required></div>
          <div class="col-md-6"><label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" required></div>
          <div class="col-md-6"><label class="form-label">A. Paterno</label>
            <input type="text" class="form-control" name="apellido_paterno" required></div>
          <div class="col-md-6"><label class="form-label">A. Materno</label>
            <input type="text" class="form-control" name="apellido_materno" required></div>

          <!-- Selección de Grado y Grupo con Modal -->
          <div class="col-md-6">
            <label class="form-label">Grado</label>
            <input type="text" class="form-control" name="grado" id="grado" readonly required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Grupo</label>
            <input type="text" class="form-control" name="grupo" id="grupo" readonly required>
          </div>
          <div class="col-12 text-center">
            <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalSeleccion">
              Seleccionar Grado y Grupo
            </button>
          </div>

          <div class="col-12"><label class="form-label">Tutor</label>
            <input type="text" class="form-control" name="tutor" required></div>
          <div class="col-12"><label class="form-label">Teléfono</label>
            <input type="text" class="form-control" name="telefono" required></div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-citrix px-4">Guardar</button>
          </div>
        </div>
      </form>
      <div id="mensaje" class="mt-3 text-center"></div>
    </div>
  </div>
</div>

<!-- Modal de Selección -->
<div class="modal fade" id="modalSeleccion" tabindex="-1" aria-labelledby="modalSeleccionLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalSeleccionLabel">Seleccionar Grado y Grupo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Grado</label>
          <select class="form-select" id="selectGrado">
            <option value="">Seleccione...</option>
            <option>1°</option>
            <option>2°</option>
            <option>3°</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Grupo</label>
          <select class="form-select" id="selectGrupo">
            <option value="">Seleccione...</option>
            <option>A</option>
            <option>B</option>
            <option>C</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-citrix" id="guardarSeleccion" data-bs-dismiss="modal">Guardar Selección</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbz6PzTzkls1f3wON-45NtzvhHmC5zNNskvQ-YeCtaqf-s5ky7YHPl4Q6HJEL8zF6cOS7A/exec";  // <-- URL de tu Web App

  // Guardar selección del modal
  document.getElementById("guardarSeleccion").addEventListener("click", ()=>{
    document.getElementById("grado").value = document.getElementById("selectGrado").value;
    document.getElementById("grupo").value = document.getElementById("selectGrupo").value;
  });

  // Registro
  document.getElementById("formRegistro").addEventListener("submit", e=>{
    e.preventDefault();
    const datos = Object.fromEntries(new FormData(e.target));
    fetch(scriptURL,{method:"POST",body:JSON.stringify(datos)})
      .then(r=>r.json())
      .then(()=>{
        document.getElementById("mensaje").innerHTML='<div class="alert alert-success">Registro guardado ✔</div>';
        e.target.reset();
      })
      .catch(err=>{
        document.getElementById("mensaje").innerHTML='<div class="alert alert-danger">Error: '+err+'</div>';
      });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gestión de Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="p-4">
  <h2 class="mb-4">Gestión de Alumnos</h2>

  <form id="formAlumno" class="row g-3 mb-4">
    <div class="col-md-2"><input type="text" id="id" class="form-control" placeholder="ID" required></div>
    <div class="col-md-2"><input type="text" id="nombre" class="form-control" placeholder="Nombre" required></div>
    <div class="col-md-2"><input type="text" id="apellidos" class="form-control" placeholder="Apellidos" required></div>
    <div class="col-md-2"><input type="text" id="grado" class="form-control" placeholder="Grado" required></div>
    <div class="col-md-2"><input type="text" id="grupo" class="form-control" placeholder="Grupo" required></div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Guardar</button>
    </div>
  </form>

  <button onclick="generarPDF()" class="btn btn-success mb-3">Generar Reporte PDF</button>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Grado</th>
        <th>Grupo</th>
        <th>Código</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaAlumnos"></tbody>
  </table>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycb.../exec'; // Reemplaza con tu URL real

    let alumnos = [];

    function cargarAlumnos() {
      fetch(scriptURL + '?action=obtenerAlumnos')
        .then(res => res.json())
        .then(data => {
          alumnos = data;
          actualizarTabla();
        });
    }

    function actualizarTabla() {
      const tbody = document.getElementById('tablaAlumnos');
      tbody.innerHTML = '';
      alumnos.forEach(al => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${al.id}</td>
          <td>${al.nombre}</td>
          <td>${al.apellidos}</td>
          <td>${al.grado}</td>
          <td>${al.grupo}</td>
          <td><svg class="barcode" jsbarcode-value="${al.codigo_barras}" jsbarcode-format="CODE128"></svg></td>
          <td>
            <button class="btn btn-warning btn-sm" onclick="editar(${al.id})">Editar</button>
            <button class="btn btn-danger btn-sm" onclick="eliminar(${al.id})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      JsBarcode(".barcode").init();
    }

    document.getElementById('formAlumno').addEventListener('submit', function (e) {
      e.preventDefault();
      const alumno = {
        id: document.getElementById('id').value,
        nombre: document.getElementById('nombre').value,
        apellidos: document.getElementById('apellidos').value,
        grado: document.getElementById('grado').value,
        grupo: document.getElementById('grupo').value
      };
      google.script.run
        .withSuccessHandler(() => {
          cargarAlumnos();
          document.getElementById('formAlumno').reset();
        })
        .agregarAlumno(alumno);
    });

    function editar(id) {
      const alumno = alumnos.find(a => a.id == id);
      document.getElementById('id').value = alumno.id;
      document.getElementById('nombre').value = alumno.nombre;
      document.getElementById('apellidos').value = alumno.apellidos;
      document.getElementById('grado').value = alumno.grado;
      document.getElementById('grupo').value = alumno.grupo;
    }

    function eliminar(id) {
      if (confirm('¿Eliminar alumno?')) {
        google.script.run
          .withSuccessHandler(() => cargarAlumnos())
          .eliminarAlumno(id);
      }
    }

    function generarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text('Reporte de Alumnos', 20, 10);
      let y = 30;
      alumnos.forEach(al => {
        doc.text(`${al.nombre} ${al.apellidos} - ${al.grado}${al.grupo}`, 20, y);
        y += 10;
      });
      doc.save('reporte_alumnos.pdf');
    }

    cargarAlumnos();
  </script>
</body>
</html>

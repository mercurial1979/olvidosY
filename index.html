<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Registro de Alumnos</title>
</head>
<body>
  <h2>Registro de Alumnos</h2>
  <form id="formRegistro">
    <input type="text" name="id" placeholder="ID" required><br>
    <input type="text" name="nombre" placeholder="Nombre" required><br>
    <input type="text" name="apellido_paterno" placeholder="Apellido Paterno" required><br>
    <input type="text" name="apellido_materno" placeholder="Apellido Materno" required><br>
    <input type="text" name="grado" placeholder="Grado" required><br>
    <input type="text" name="grupo" placeholder="Grupo" required><br>
    <input type="text" name="tutor" placeholder="Nombre del Tutor" required><br>
    <input type="text" name="telefono" placeholder="Teléfono del Tutor" required><br>
    <button type="submit">Guardar</button>
  </form>

  <p id="mensaje"></p>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbz6PzTzkls1f3wON-45NtzvhHmC5zNNskvQ-YeCtaqf-s5ky7YHPl4Q6HJEL8zF6cOS7A/exec"; // <- pega aquí la URL de Apps Script

    document.getElementById("formRegistro").addEventListener("submit", e => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const datos = Object.fromEntries(formData.entries());

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(datos)
      })
      .then(res => res.json())
      .then(respuesta => {
        document.getElementById("mensaje").innerText = "Registro guardado con éxito.";
        e.target.reset();
      })
      .catch(err => {
        document.getElementById("mensaje").innerText = "Error al guardar: " + err;
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .barcode-container {
            text-align: center;
            margin: 20px 0;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registro de Estudiantes</h2>
        <form id="registroForm">
            <div class="form-group">
                <label for="id">ID:</label>
                <input type="text" id="id" name="id" readonly>
            </div>
            
            <div class="form-group">
                <label for="nombre">Nombre(s):</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label for="apellidoPaterno">Apellido Paterno:</label>
                <input type="text" id="apellidoPaterno" name="apellidoPaterno" required>
            </div>
            
            <div class="form-group">
                <label for="apellidoMaterno">Apellido Materno:</label>
                <input type="text" id="apellidoMaterno" name="apellidoMaterno" required>
            </div>
            
            <div class="form-group">
                <label for="turno">Turno:</label>
                <select id="turno" name="turno" required>
                    <option value="">Selecciona un turno</option>
                    <option value="Matutino">Matutino</option>
                    <option value="Vespertino">Vespertino</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="grado">Grado:</label>
                <select id="grado" name="grado" required>
                    <option value="">Selecciona un grado</option>
                    <option value="1">1°</option>
                    <option value="2">2°</option>
                    <option value="3">3°</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="grupo">Grupo:</label>
                <select id="grupo" name="grupo" required>
                    <option value="">Selecciona un grupo</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                </select>
            </div>
            
            <div class="barcode-container">
                <svg id="barcode"></svg>
            </div>
            
            <input type="hidden" id="codigoBarras" name="codigoBarras">
            
            <button type="submit">Guardar Registro</button>
            
            <div class="success-message" id="successMessage">
                ¡Registro guardado exitosamente!
            </div>
        </form>
    </div>

    <script>
        // Reemplaza esto con tu URL de Google Apps Script
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwhDIpyvUDE-9ohTHZsBPhJ8p2ZbetG1cXQWsMkwlu017_xHb7ecAa7WNWpiagMyBwzXA/exec';
        
        // Generar ID automático
        async function generarId() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL + '?action=obtenerUltimoId');
                const data = await response.text();
                document.getElementById('id').value = data;
                generarCodigoBarras(data);
            } catch (error) {
                console.error('Error al generar ID:', error);
                document.getElementById('id').value = '1';
                generarCodigoBarras('1');
            }
        }
        
        // Generar código de barras
        function generarCodigoBarras(id) {
            const codigo = `${id}-${Date.now()}`;
            document.getElementById('codigoBarras').value = codigo;
            
            JsBarcode("#barcode", codigo, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 50,
                displayValue: true
            });
        }
        
        // Manejar envío del formulario
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(document.getElementById('registroForm'));
            const params = new URLSearchParams();
            
            for (let [key, value] of formData.entries()) {
                params.append(key, value);
            }
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: params
                });
                
                if (response.ok) {
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('registroForm').reset();
                    setTimeout(() => {
                        document.getElementById('successMessage').style.display = 'none';
                        generarId();
                    }, 3000);
                }
            } catch (error) {
                alert('Error al guardar los datos. Por favor, intenta de nuevo.');
                console.error('Error:', error);
            }
        });
        
        // Generar ID al cargar la página
        generarId();
    </script>
</body>
</html>

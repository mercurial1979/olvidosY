<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Registro de Alumnos</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: auto; }
    label { display: block; margin-top: 10px; }
    input { width: 100%; padding: 5px; }
    button { margin-top: 15px; padding: 10px; width: 100%; }
  </style>
</head>
<body>
  <h2>Formulario de Registro</h2>
  <form id="formRegistro">
    <label>ID:</label>
    <input type="text" name="id" required>
    
    <label>Nombre:</label>
    <input type="text" name="nombre" required>
    
    <label>Apellidos:</label>
    <input type="text" name="apellidos" required>
    
    <label>Grado:</label>
    <input type="text" name="grado" required>
    
    <label>Grupo:</label>
    <input type="text" name="grupo" required>
    
    <label>Teléfono de contacto:</label>
    <input type="tel" name="telefono" required>
    
    <button type="submit">Enviar</button>
  </form>

  <script>
    document.getElementById("formRegistro").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const data = {};
      formData.forEach((value, key) => data[key] = value);
      
      fetch("https://script.google.com/macros/s/AKfycbxezJSK3CO0zXaPYVV_aJ8L72uWNqyOaj1_jlVZmfArK04yCUH83eSCEpaMeOiOmuct/exec", {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        alert("Datos guardados correctamente");
        e.target.reset();
      })
      .catch(err => alert("Error al enviar datos: " + err));
    });
  </script>
</body>
</html>

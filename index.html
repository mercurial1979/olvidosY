<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alta y QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body{font-family:Arial;margin:30px}
    label{display:block;margin:8px 0}
    #qrCode{margin-top:20px}
  </style>
</head>
<body>
  <h1>Alta de alumno y generación de QR</h1>
  <form id="formAlta">
    <label>Número de control:
      <input type="text" name="control" required>
    </label>
    <label>Grado:
      <input type="text" name="grado" required>
    </label>
    <label>Grupo:
      <input type="text" name="grupo" required>
    </label>
    <label>Turno:
      <input type="text" name="turno" required>
    </label>
    <label>Número de tutor:
      <input type="text" name="tutor" required>
    </label>
    <button type="submit">Dar de alta</button>
  </form>

  <div id="qrCode" style="display:none">
    <h3>Código QR para registrar asistencia</h3>
    <canvas id="qrCanvas"></canvas>
    <p><a id="qrLink" target="_blank">Abrir enlace del QR</a></p>
  </div>

  <script>
  const urlScript = 'https://script.google.com/macros/s/XXXXXXXX/exec'; // <-- cambia XXXXXX
  const form = document.getElementById('formAlta');
  const qrDiv = document.getElementById('qrCode');
  const qrCanvas = document.getElementById('qrCanvas');
  const qrLink = document.getElementById('qrLink');

  form.addEventListener('submit', e => {
    e.preventDefault();
    const data = new FormData(form);
    fetch(urlScript, {method:'POST', body:data})
      .then(r=>r.text())
      .then(()=>{
        // Datos para el QR
        const control = form.control.value.trim();
        const grado   = form.grado.value.trim();
        const grupo   = form.grupo.value.trim();
        const turno   = form.turno.value.trim();

        // Creamos la URL con parámetros
        const qrUrl = `${urlScript}?control=${encodeURIComponent(control)}&grado=${encodeURIComponent(grado)}&grupo=${encodeURIComponent(grupo)}&turno=${encodeURIComponent(turno)}`;

        QRCode.toCanvas(qrCanvas, qrUrl);
        qrLink.href = qrUrl;
        qrDiv.style.display = 'block';
      });
  });
</script>
</body>
</html>

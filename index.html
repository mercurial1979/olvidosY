<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Alumnos</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      max-width: 600px;
      margin: 2rem auto;
      border-radius: 1rem;
    }
    .btn-citrix {
      background-color: #0f2b4b;
      color: #fff;
      border: none;
    }
    .btn-citrix:hover {
      background-color: #0d1f36;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <div class="card shadow">
      <div class="card-header text-center">
        <h4 class="mb-0">Registro de Alumnos</h4>
      </div>
      <div class="card-body">
        <form id="formRegistro">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="id" class="form-label">ID</label>
              <input type="text" class="form-control" id="id" name="id" placeholder="ID" required>
            </div>
            <div class="col-md-6">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <label for="apellido_paterno" class="form-label">Apellido Paterno</label>
              <input type="text" class="form-control" id="apellido_paterno" name="apellido_paterno" placeholder="Apellido Paterno" required>
            </div>
            <div class="col-md-6">
              <label for="apellido_materno" class="form-label">Apellido Materno</label>
              <input type="text" class="form-control" id="apellido_materno" name="apellido_materno" placeholder="Apellido Materno" required>
            </div>
            <div class="col-md-6">
              <label for="grado" class="form-label">Grado</label>
              <input type="text" class="form-control" id="grado" name="grado" placeholder="Grado" required>
            </div>
            <div class="col-md-6">
              <label for="grupo" class="form-label">Grupo</label>
              <input type="text" class="form-control" id="grupo" name="grupo" placeholder="Grupo" required>
            </div>
            <div class="col-12">
              <label for="tutor" class="form-label">Nombre del Tutor</label>
              <input type="text" class="form-control" id="tutor" name="tutor" placeholder="Nombre del Tutor" required>
            </div>
            <div class="col-12">
              <label for="telefono" class="form-label">Teléfono del Tutor</label>
              <input type="text" class="form-control" id="telefono" name="telefono" placeholder="Teléfono del Tutor" required>
            </div>
            <div class="col-12 text-center">
              <button type="submit" class="btn btn-citrix px-4">Guardar</button>
            </div>
          </div>
        </form>

        <div id="mensaje" class="mt-3 text-center"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbz6PzTzkls1f3wON-45NtzvhHmC5zNNskvQ-YeCtaqf-s5ky7YHPl4Q6HJEL8zF6cOS7A/exec"; // <- pega aquí la URL de Apps Script

    document.getElementById("formRegistro").addEventListener("submit", e => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const datos = Object.fromEntries(formData.entries());

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(datos)
      })
      .then(res => res.json())
      .then(respuesta => {
        document.getElementById("mensaje").innerHTML = 
          '<div class="alert alert-success">Registro guardado con éxito.</div>';
        e.target.reset();
      })
      .catch(err => {
        document.getElementById("mensaje").innerHTML = 
          '<div class="alert alert-danger">Error al guardar: ' + err + '</div>';
      });
    });
  </script>
</body>
</html>

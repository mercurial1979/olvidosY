<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registrar Alumno</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container py-5">
  <h2 class="mb-4">Registrar Alumno</h2>
  <form id="formRegistro">
    <div class="row g-3">
      <div class="col-md-2">
        <input type="text" name="id" class="form-control" placeholder="ID" required />
      </div>
      <div class="col-md-3">
        <input type="text" name="nombre" class="form-control" placeholder="Nombre" required />
      </div>
      <div class="col-md-3">
        <input type="text" name="apellido_paterno" class="form-control" placeholder="Apellido Paterno" required />
      </div>
      <div class="col-md-3">
        <input type="text" name="apellido_materno" class="form-control" placeholder="Apellido Materno" required />
      </div>
      <div class="col-md-3">
        <input type="tel" name="telefono" class="form-control" placeholder="Teléfono" required />
      </div>
      <div class="col-md-2">
        <input type="number" name="numero_reportes" class="form-control" placeholder="Reportes" min="0" value="0" />
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Guardar Alumno</button>
  </form>

  <div id="mensaje" class="mt-3"></div>
</div>

<script>
  document.getElementById('formRegistro').addEventListener('submit', e => {
    e.preventDefault();
    const formData = new FormData(e.target);
    fetch('https://script.google.com/macros/s/TU_SCRIPT_ID/exec', {
      method: 'POST',
      body: formData
    })
    .then(response => {
      if (!response.ok) throw new Error('Respuesta no OK');
      return response.json();
    })
    .then(data => {
      if (data.status === 'ok') {
        alert('Alumno guardado con éxito');
        e.target.reset();
      } else {
        alert('Error: ' + data.message);
      }
    })
    .catch(error => {
      alert('Error en la petición: ' + error.message);
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alta y QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body{font-family:Arial;margin:30px}
    label{display:block;margin:8px 0}
    #qrCode{margin-top:20px}
  </style>
</head>
<body>
  <h1>Alta de alumno</h1>
  <form id="formAlta">
    <label>Nombre:
      <input name="nombre" required>
    </label>
    <label>Número de control:
      <input name="control" required>
    </label>
    <label>Grado:
      <input name="grado" required>
    </label>
    <label>Grupo:
      <input name="grupo" required>
    </label>
    <label>Turno:
      <input name="turno" required>
    </label>
    <label>Tutor:
      <input name="tutor" required>
    </label>
    <button type="submit">Dar de alta</button>
  </form>

  <p id="msg"></p>

  <div id="qrCode" style="display:none">
    <h3>Código QR para asistencia</h3>
    <canvas id="qrCanvas"></canvas>
  </div>

  <script>
    const urlScript = 'https://script.google.com/macros/s/AKfycbwc0uteSefxudfYpsDXRrGhy383d6bp42Cgt5AQwL2ox7uqrl_1lcvZiFb1dnrU0OkP/exec'; // <-- cambia esto
    const baseEsc   = 'https://mercurial1979.github.io/olvidosY/escaner.html'; // <-- cambia esto

    const form = document.getElementById('formAlta');
    const msg  = document.getElementById('msg');
    const qrCanvas = document.getElementById('qrCanvas');
    const qrCode   = document.getElementById('qrCode');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = new FormData(form);
      fetch(urlScript, {method:'POST', body:data})
        .then(r => r.text())
        .then(txt => {
          msg.textContent = txt; // "Alta registrada"
          const control = form.control.value.trim();
          const nombre  = form.nombre.value.trim();
          const grado   = form.grado.value.trim();
          const grupo   = form.grupo.value.trim();
          const turno   = form.turno.value.trim();
          const qrUrl = `${baseEsc}?control=${encodeURIComponent(control)}&nombre=${encodeURIComponent(nombre)}&grado=${encodeURIComponent(grado)}&grupo=${encodeURIComponent(grupo)}&turno=${encodeURIComponent(turno)}`;
          QRCode.toCanvas(qrCanvas, qrUrl);
          qrCode.style.display = 'block';
        })
        .catch(() => msg.textContent = 'Error al dar de alta');
    });
  </script>
</body>
</html>

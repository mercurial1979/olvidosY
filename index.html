<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alta y código de barras</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>body{font-family:Arial;margin:30px}label{display:block;margin:8px 0}</style>
</head>
<body>
  <h1>Alta de alumno</h1>
  <form id="formAlta">
    <label>ID: <input name="id" required></label>
    <label>Nombre: <input name="nombre" required></label>
    <label>Apellido paterno: <input name="apepat" required></label>
    <label>Apellido materno: <input name="apemat" required></label>
    <label>Grado: <input name="grado" required></label>
    <label>Grupo: <input name="grupo" required></label>
    <button type="submit">Guardar y generar código</button>
  </form>

  <p id="msg"></p>

  <div id="barcodeDiv" style="display:none;text-align:center;margin-top:30px">
    <svg id="barcode"></svg><br>
    <small>Escanea este código para pasar asistencia</small>
  </div>

  <script>
    const urlScript = 'https://script.google.com/macros/s/AKfycbyFQTE9jqM8vj3Ra0PM14SqwAPqcJF2ay8pj6Akc63YAMlwJ_kVf0SNup3ixbI6Fjo/exec'; // <-- cambia

    document.getElementById('formAlta').addEventListener('submit', e => {
      e.preventDefault();
      const data = new FormData(e.target);
      fetch(urlScript, {method:'POST', body:data})
        .then(r => r.text())
        .then(txt => {
          document.getElementById('msg').textContent = txt;
          const id = e.target.id.value;
          JsBarcode('#barcode', id, {format:'CODE128', width:2, height:100});
          document.getElementById('barcodeDiv').style.display = 'block';
        })
        .catch(() => document.getElementById('msg').textContent = 'Error al guardar');
    });
  </script>
</body>
</html>

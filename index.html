<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Alumnos</title>
</head>
<body>
<h2>Formulario de Alumnos</h2>
<form id="alumnoForm">
  <input type="text" name="id" placeholder="ID" required><br>
  <input type="text" name="nombre" placeholder="Nombre" required><br>
  <input type="text" name="apellido_paterno" placeholder="Apellido Paterno" required><br>
  <input type="text" name="apellido_materno" placeholder="Apellido Materno" required><br>
  <input type="text" name="grado" placeholder="Grado" required><br>
  <input type="text" name="grupo" placeholder="Grupo" required><br>
  <input type="text" name="telefono_tutor" placeholder="Teléfono Tutor" required><br>
  <input type="number" name="numero_reportes" placeholder="Número de reportes" required><br>
  <button type="button" onclick="guardar()">Guardar</button>
  <button type="button" onclick="modificar()">Modificar</button>
  <button type="button" onclick="generarPDF()">Generar PDF</button>
</form>

<script>
const scriptURL = "URL_DE_TU_APPS_SCRIPT"; // Pega aquí la URL

function guardar() {
  enviarDatos("add");
}

function modificar() {
  enviarDatos("update");
}

function generarPDF() {
  enviarDatos("pdf");
}

function enviarDatos(action) {
  const form = document.getElementById("alumnoForm");
  const data = Object.fromEntries(new FormData(form).entries());
  data.action = action;

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(txt => {
    if (action === "pdf") {
      window.open(txt, "_blank");
    } else {
      alert(txt);
    }
  })
  .catch(err => alert("Error: " + err));
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registrar Alumno</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container py-5">
  <h2 class="mb-4">Registrar Alumno</h2>
  <form id="formRegistro">
    <div class="row g-3">
      <div class="col-md-2">
        <input type="text" name="id" class="form-control" placeholder="ID" required />
      </div>
      <div class="col-md-3">
        <input type="text" name="nombre" class="form-control" placeholder="Nombre" required />
      </div>
      <div class="col-md-3">
        <input type="text" name="apellido_paterno" class="form-control" placeholder="Apellido Paterno" required />
      </div>
      <div class="col-md-3">
        <input type="text" name="apellido_materno" class="form-control" placeholder="Apellido Materno" required />
      </div>
      <div class="col-md-3">
        <input type="tel" name="telefono" class="form-control" placeholder="Teléfono" required />
      </div>
      <div class="col-md-2">
        <input type="number" name="numero_reportes" class="form-control" placeholder="Reportes" min="0" value="0" />
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Guardar Alumno</button>
  </form>

  <div id="mensaje" class="mt-3"></div>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyIecXQs_knU_INbkd1-T7Ibme3WUD086Qthq3cSD3OKzV82mFc3cMWJNXRzvJ4oRH1Yg/exec'; // Cambia aquí la URL

  document.getElementById('formRegistro').addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);

    fetch(scriptURL, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      const mensajeDiv = document.getElementById('mensaje');
      if(data.status === 'ok') {
        mensajeDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
        form.reset();
      } else {
        mensajeDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
      }
    })
    .catch(error => {
      document.getElementById('mensaje').innerHTML = `<div class="alert alert-danger">Error al guardar: ${error.message}</div>`;
    });
  });
</script>
</body>
</html>

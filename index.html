<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Escolar</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, select, button { width: 100%; padding: 8px; margin: 5px 0; }
        button { background: #4CAF50; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Registro de Estudiantes</h2>
    <form id="formulario">
        <input type="number" name="id" placeholder="ID" required>
        <input type="text" name="nombre" placeholder="Nombre(s)" required>
        <input type="text" name="apellidoPaterno" placeholder="Apellido Paterno" required>
        <input type="text" name="apellidoMaterno" placeholder="Apellido Materno" required>

        <select name="turno" required>
            <option value="">Selecciona Turno</option>
            <option>Matutino</option>
            <option>Vespertino</option>
        </select>

        <select name="grado" required>
            <option value="">Selecciona Grado</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
        </select>

        <select name="grupo" required>
            <option value="">Selecciona Grupo</option>
            <option>A</option>
            <option>B</option>
            <option>C</option>
            <option>D</option>
            <option>E</option>
        </select>

        <button type="submit">Guardar</button>
        <p id="mensaje" style="color: green; display: none;">✅ Guardado exitosamente</p>
    </form>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwhDIpyvUDE-9ohTHZsBPhJ8p2ZbetG1cXQWsMkwlu017_xHb7ecAa7WNWpiagMyBwzXA/exec';

        document.getElementById('formulario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = new FormData(e.target);
            await fetch(scriptURL, { method: 'POST', body: form });
            e.target.reset();
            document.getElementById('mensaje').style.display = 'block';
            setTimeout(() => document.getElementById('mensaje').style.display = 'none', 3000);
        });
    </script>
</body>
</html>
